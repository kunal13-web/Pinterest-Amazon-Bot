name: Pinterest posting bot

on:
  schedule:
    - cron: "0 15 * * *"   # daily 15:00 UTC (~11:00 AM US Eastern)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build images, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pinterest-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG || 'stylenestus-20' }}
          PINS_PER_RUN: ${{ vars.PINS_PER_RUN || '2' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python script.py

      - name: Save pin images from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-images
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit posted.json
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add posted.json
            git commit -m "Update posted.json"
            git push
          fi
