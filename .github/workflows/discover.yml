name: Discover trending keywords

on:
  workflow_dispatch:
    inputs:
      trend_type:
        description: "growing, monthly, yearly or seasonal"
        default: "growing"
      interests:
        description: "Optional Pinterest interest filter (leave empty for all categories)"
        default: ""

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull trending keywords
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG || 'stylenestus-20' }}
          TREND_TYPE: ${{ inputs.trend_type }}
          TREND_INTERESTS: ${{ inputs.interests }}
        run: python discover.py
      - name: Save candidates.csv
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates.csv
          retention-days: 14
